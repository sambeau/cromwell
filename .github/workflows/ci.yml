name: CI

# The suite is host-agnostic: it takes SUBUTAI_TEST_DATABASE_URL and creates
# isolated per-package test databases on the target server. This job runs it
# against plain Postgres (DEC-002's compatibility boundary). SPEC-002 NFR-2
# also requires a Supabase-local-stack run; that matrix leg is added when a
# hosted runner with the Supabase CLI is available (the suite itself needs no
# change — only the connection URL).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: subutai
          POSTGRES_DB: subutai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUBUTAI_TEST_DATABASE_URL: postgres://postgres:subutai@localhost:5432/subutai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
